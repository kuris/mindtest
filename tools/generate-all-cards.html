    function drawRoundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function renderOGCard(item) {
      var canvas = document.createElement('canvas');
      var w = 1200;
      var h = 630;
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');

      var th = THEMES[item.theme] || THEMES.love;

      // 1) 배경 그라디언트
      var grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, th.bg1);
      grad.addColorStop(1, th.bg2);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // 은은한 배경 원 & 데코
      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.beginPath(); ctx.arc(120, 110, 180, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(w - 100, 160, 150, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(140, h - 90, 140, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(w - 120, h - 110, 200, 0, Math.PI * 2); ctx.fill();

      // 반짝이 별
      ctx.font = '32px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('✨', 180, 240);
      ctx.fillText('💫', w - 180, 150);
      ctx.fillText('💖', w - 160, 430);
      ctx.fillText('✨', 150, h - 220);

      // 2) 상단 캡슐 태그
      var tagText = '마인드테스트  ·  ' + item.kicker;
      ctx.font = '600 24px "Jua", sans-serif';
      var tagW = ctx.measureText(tagText).width + 52;
      var tagX = (w - tagW) / 2;
      var tagY = 62;
      drawRoundRect(ctx, tagX, tagY, tagW, 46, 23);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText(tagText, w / 2, tagY + 32);

      // 3) 이모지 원형 페데스탈
      var emojiCenterY = 220;
      var pedestalR = 76;
      ctx.beginPath();
      ctx.arc(w / 2, emojiCenterY, pedestalR, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.15)';
      ctx.shadowBlur = 24;
      ctx.shadowOffsetY = 6;
      ctx.fill();
      ctx.shadowColor = 'transparent';

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Apple Color Emoji
      ctx.font = '96px "Apple Color Emoji", -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(item.emoji, w / 2, emojiCenterY + 34);

      // 4) 결과명 (Jua 폰트 볼드)
      var nameY = 370;
      ctx.font = 'bold 74px "Jua", sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 6;
      ctx.fillText(item.title, w / 2, nameY);
      ctx.shadowColor = 'transparent';

      // 5) 부제목 / 한 줄 요약
      var subY = 435;
      ctx.font = '500 29px "Gowun Dodum", -apple-system, sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.15)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 3;
      ctx.fillText(item.subtitle, w / 2, subY);
      ctx.shadowColor = 'transparent';

      // 6) 하단 화이트 바이럴 CTA 버튼
      var ctaW = 420;
      var ctaH = 56;
      var ctaX = (w - ctaW) / 2;
      var ctaY = 502;
      drawRoundRect(ctx, ctaX, ctaY, ctaW, ctaH, 28);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 6;
      ctx.fill();
      ctx.shadowColor = 'transparent';

      ctx.fillStyle = th.tag;
      ctx.font = 'bold 26px "Jua", sans-serif';
      ctx.fillText('👉  너도 해봐! mindtest.chatgpts.kr', w / 2, ctaY + 38);

      return canvas;
    }

    async function sendToServer(dataUrl, filename) {
      const res = await fetch('http://localhost:8091/save-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: dataUrl, filename: filename })
      });
      return await res.json();
    }

    async function runBatch() {
      document.getElementById('status').innerText = '렌더링 시작... 총 ' + OG_LIST.length + '개';
      log('총 ' + OG_LIST.length + '개의 OG 카드를 생성합니다.');

      for (var i = 0; i < OG_LIST.length; i++) {
        var item = OG_LIST[i];
        try {
          var canvas = renderOGCard(item);
          var dataUrl = canvas.toDataURL('image/png');

          // 미리보기 추가
          if (i < 6) {
            var img = document.createElement('img');
            img.src = dataUrl;
            img.title = item.file;
            document.getElementById('previews').appendChild(img);
          }

          var result = await sendToServer(dataUrl, item.file);
          log('✅ (' + (i + 1) + '/' + OG_LIST.length + ') ' + item.file + ' 완료');
        } catch (e) {
          log('❌ 오류 (' + item.file + '): ' + e.message);
        }
      }

      // 모바일 결과 카드 1080x1460 렌더링 테스트
      try {
        log('모바일 결과 카드 (1080x1460) 렌더링 중...');
        var mobileData = {
          testId: 'money',
          kicker: '소비 성향 테스트 결과',
          name: '자린고비 절약왕',
          summary: '10원 한 장도 허투루 쓰지 않는 철벽 방어 절약러!',
          emoji: '🛡️',
          badge: '소비 지수 15% · 절약 레벨 MAX',
          traits: [
            '가계부와 영수증 정리는 나의 기본 일상이에요',
            '할인 쿠폰과 페이백 혜택은 절대 놓치지 않아요',
            '충동구매 대신 3일 생각하고 결정하는 신중파예요'
          ]
        };
        var mobileCanvas = renderMobileCard(mobileData);
        var mobileDataUrl = mobileCanvas.toDataURL('image/png');
        await sendToServer(mobileDataUrl, 'tools/test_mobile_card.png');
        log('✅ 모바일 결과 카드 tools/test_mobile_card.png 완료');
      } catch (me) {
        log('❌ 모바일 카드 오류: ' + me.message);
      }

      document.getElementById('status').innerText = '🎉 모든 카드 생성 완료!';
      log('\n🎉 모든 작업이 성공적으로 완료되었습니다!');
    }

    function renderMobileCard(data) {
      var canvas = document.createElement('canvas');
      var w = 1080;
      var h = 1460;
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      var theme = THEMES[data.testId] || THEMES.love;

      // 1) 전체 배경
      var bgGrad = ctx.createLinearGradient(0, 0, w, h);
      bgGrad.addColorStop(0, theme.soft);
      bgGrad.addColorStop(0.5, '#ffffff');
      bgGrad.addColorStop(1, theme.soft);
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // 귀여운 파스텔 장식 원들
      ctx.fillStyle = theme.bg1 + '18';
      ctx.beginPath(); ctx.arc(100, 120, 160, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(w - 80, 220, 140, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(120, h - 140, 130, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(w - 120, h - 200, 180, 0, Math.PI * 2); ctx.fill();

      // 반짝이 별
      function drawSparkle(x, y, size) {
        ctx.font = size + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('✨', x, y);
      }
      drawSparkle(90, 260, 36);
      drawSparkle(w - 100, 140, 32);
      drawSparkle(w - 85, 420, 28);
      drawSparkle(80, h - 340, 30);

      // 2) 메인 라운드 화이트 카드
      var cx = 55, cy = 60, cw = 970, ch = 1340, cr = 44;
      drawRoundRect(ctx, cx, cy, cw, ch, cr);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.08)';
      ctx.shadowBlur = 45;
      ctx.shadowOffsetY = 18;
      ctx.fill();
      ctx.shadowColor = 'transparent';

      // 카드 테두리
      ctx.strokeStyle = theme.bg1 + '28';
      ctx.lineWidth = 3;
      ctx.stroke();

      // 카드 상단 파스텔 헤더 바
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx + cr, cy);
      ctx.lineTo(cx + cw - cr, cy);
      ctx.quadraticCurveTo(cx + cw, cy, cx + cw, cy + cr);
      ctx.lineTo(cx + cw, cy + 18);
      ctx.lineTo(cx, cy + 18);
      ctx.lineTo(cx, cy + cr);
      ctx.quadraticCurveTo(cx, cy, cx + cr, cy);
      ctx.closePath();
      var topBarGrad = ctx.createLinearGradient(cx, cy, cx + cw, cy);
      topBarGrad.addColorStop(0, theme.bg1);
      topBarGrad.addColorStop(1, theme.bg2);
      ctx.fillStyle = topBarGrad;
      ctx.fill();
      ctx.restore();

      // 3) 상단 브랜드 & 테스트 이름 태그
      var tagText = '마인드테스트  ·  ' + (data.kicker || '심리테스트 결과');
      ctx.font = '600 24px "Jua", sans-serif';
      var tagW = ctx.measureText(tagText).width + 48;
      var tagX = (w - tagW) / 2;
      var tagY = 110;
      drawRoundRect(ctx, tagX, tagY, tagW, 44, 22);
      ctx.fillStyle = theme.soft;
      ctx.fill();
      ctx.fillStyle = theme.tag;
      ctx.textAlign = 'center';
      ctx.fillText(tagText, w / 2, tagY + 31);

      // 4) 거대 이모지 & 파스텔 원형 배경
      var emojiCenterY = 275;
      var emojiPedestalR = 82;
      ctx.beginPath();
      ctx.arc(w / 2, emojiCenterY, emojiPedestalR, 0, Math.PI * 2);
      var emojiGrad = ctx.createRadialGradient(w / 2, emojiCenterY - 20, 10, w / 2, emojiCenterY, emojiPedestalR);
      emojiGrad.addColorStop(0, '#ffffff');
      emojiGrad.addColorStop(1, theme.soft);
      ctx.fillStyle = emojiGrad;
      ctx.shadowColor = theme.bg1 + '35';
      ctx.shadowBlur = 24;
      ctx.shadowOffsetY = 8;
      ctx.fill();
      ctx.shadowColor = 'transparent';

      ctx.strokeStyle = theme.bg1 + '40';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.font = '105px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(data.emoji, w / 2, emojiCenterY + 36);

      // 이모지 양옆 미니 데코
      ctx.font = '28px sans-serif';
      ctx.fillText('💫', w / 2 - 120, emojiCenterY - 25);
      ctx.fillText('💖', w / 2 + 120, emojiCenterY + 25);

      // 5) 결과명
      var nameY = 430;
      ctx.font = 'bold 58px "Jua", sans-serif';
      var nameW = ctx.measureText(data.name).width;

      // 형광펜 효과
      ctx.fillStyle = theme.bg1 + '25';
      drawRoundRect(ctx, (w - nameW) / 2 - 14, nameY - 22, nameW + 28, 32, 16);
      ctx.fill();

      ctx.fillStyle = '#1e272e';
      ctx.fillText(data.name, w / 2, nameY + 6);

      // 6) 요약 멘트
      var quoteY = 475;
      ctx.font = '500 27px "Gowun Dodum", sans-serif';
      var quoteText = '“ ' + data.summary + ' ”';
      ctx.fillStyle = '#4b5563';
      ctx.fillText(quoteText, w / 2, quoteY + 20);

      // 7) 배지
      var contentStartY = 540;
      if (data.badge) {
        ctx.font = 'bold 23px "Jua", sans-serif';
        var badgeW = ctx.measureText(data.badge).width + 48;
        var badgeX = (w - badgeW) / 2;
        var badgeY = contentStartY;
        drawRoundRect(ctx, badgeX, badgeY, badgeW, 44, 22);
        var badgeGrad = ctx.createLinearGradient(badgeX, badgeY, badgeX + badgeW, badgeY);
        badgeGrad.addColorStop(0, theme.bg1);
        badgeGrad.addColorStop(1, theme.bg2);
        ctx.fillStyle = badgeGrad;
        ctx.shadowColor = theme.bg1 + '40';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 4;
        ctx.fill();
        ctx.shadowColor = 'transparent';

        ctx.fillStyle = '#ffffff';
        ctx.fillText('✨ ' + data.badge, w / 2, badgeY + 30);
        contentStartY = 615;
      }

      // 8) 핵심 특징 리스트 박스
      var boxX = 100, boxY = contentStartY + 10, boxW = 880, boxH = 430;
      drawRoundRect(ctx, boxX, boxY, boxW, boxH, 32);
      ctx.fillStyle = theme.soft + '80';
      ctx.fill();
      ctx.strokeStyle = theme.bg1 + '20';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#2c2a33';
      ctx.font = 'bold 28px "Jua", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('💖  나의 핵심 특징 & 매력', boxX + 40, boxY + 54);

      var itemY = boxY + 86;
      var itemH = 92;
      var itemW = boxW - 60;
      var icons = ['🍀', '⭐', '⚡', '🌷'];

      data.traits.forEach(function (tr, idx) {
        drawRoundRect(ctx, boxX + 30, itemY, itemW, itemH, 20);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.04)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 4;
        ctx.fill();
        ctx.shadowColor = 'transparent';

        drawRoundRect(ctx, boxX + 48, itemY + 22, 48, 48, 14);
        ctx.fillStyle = theme.soft;
        ctx.fill();
        ctx.font = '24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(icons[idx % icons.length], boxX + 72, itemY + 56);

        ctx.fillStyle = '#2d3748';
        ctx.font = '500 26px "Gowun Dodum", sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(tr, boxX + 115, itemY + 54);

        itemY += itemH + 16;
      });

      // 9) 하단 CTA
      var footY = boxY + boxH + 60;
      var ctaW = 540;
      var ctaH = 64;
      var ctaX = (w - ctaW) / 2;
      drawRoundRect(ctx, ctaX, footY, ctaW, ctaH, 32);
      var ctaGrad = ctx.createLinearGradient(ctaX, footY, ctaX + ctaW, footY);
      ctaGrad.addColorStop(0, theme.bg1);
      ctaGrad.addColorStop(1, theme.bg2);
      ctx.fillStyle = ctaGrad;
      ctx.shadowColor = theme.bg1 + '50';
      ctx.shadowBlur = 20;
      ctx.shadowOffsetY = 6;
      ctx.fill();
      ctx.shadowColor = 'transparent';

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 28px "Jua", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('👉  너도 해봐! mindtest.chatgpts.kr', w / 2, footY + 43);

      ctx.fillStyle = '#9ca3af';
      ctx.font = '500 20px "Gowun Dodum", sans-serif';
      ctx.fillText('마인드테스트 · 3분이면 끝나는 심리테스트 모음', w / 2, footY + 105);

      return canvas;
    }

    // 폰트 로드 대기 후 실행
    document.fonts.ready.then(function () {
      setTimeout(runBatch, 500);
    });
  </script>
